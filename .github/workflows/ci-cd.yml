name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'application/**'
      - 'k8s-manifests/**'

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: [self-hosted, terraform]
    outputs:
      app_changed: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'application/**'

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.app_changed == 'true'
    runs-on: [self-hosted, terraform]
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        working-directory: application
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: aws-eks-terraform
        run: |
          docker build -t $REGISTRY/$REPOSITORY:${{ github.sha }} .
          docker push $REGISTRY/$REPOSITORY:${{ github.sha }}

      - id: set-tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-to-eks:
    needs: [detect-changes, build-and-push]
    if: |
      always() &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: [self-hosted, terraform]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APP_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to EKS
        working-directory: k8s-manifests
        run: |
          set -e

          aws eks update-kubeconfig \
            --region us-east-1 \
            --name aws-eks-terraform

          if [ "${{ needs.detect-changes.outputs.app_changed }}" = "true" ]; then
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          else
            IMAGE_TAG=$(kubectl get deployment task-api-deploy \
              -o jsonpath='{.spec.template.spec.containers[0].image}' \
              | awk -F: '{print $NF}')
          fi

          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: IMAGE_TAG is empty"
            exit 1
          fi

          sed -i "s|__ECR_REPOSITORY_URI__|${{ vars.ECR_REPOSITORY_URI }}|g" deployment.yaml
          sed -i "s|__IMAGE_TAG__|$IMAGE_TAG|g" deployment.yaml

          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl apply -f ingress.yaml

          kubectl rollout status deployment/task-api-deploy --timeout=120s