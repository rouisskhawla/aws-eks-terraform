name: CI/CD Pipeline with  ArgoCD 

on:
  push:
    branches: [main]
    paths:
      - 'application/**'
      - 'k8s-manifests/**'

permissions:
  id-token: write
  contents: write

jobs:
  detect-changes:
    runs-on: [self-hosted, terraform]
    outputs:
      app_changed: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'application/**'

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.app_changed == 'true'
    runs-on: [self-hosted, terraform]
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        working-directory: application
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: aws-eks-terraform
        run: |
          docker build -t $REGISTRY/$REPOSITORY:${{ github.sha }} .
          docker push $REGISTRY/$REPOSITORY:${{ github.sha }}

      - id: set-tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  update-manifest:
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.app_changed == 'true'
    runs-on: [self-hosted, terraform]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update image tag and commit
        working-directory: k8s-manifests
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i -E "s|aws-eks-terraform:[a-zA-Z0-9_-]+|aws-eks-terraform:${IMAGE_TAG}|g" deployment.yaml
          if git diff --quiet deployment.yaml; then
            echo "No change to commit"
          else
            git add deployment.yaml
            git commit -m "chore: deploy image ${IMAGE_TAG}"
            git push origin main
          fi