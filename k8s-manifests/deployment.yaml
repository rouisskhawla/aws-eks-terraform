apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api-deploy
  labels:
    app:  task-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  task-api
  template:
    metadata:
      labels:
        app:  task-api
    spec:
      containers:
      - name:  task-api
        image: 558073272056.dkr.ecr.us-east-1.amazonaws.com/aws-eks-terraform:35c29f8ae2c82dd82fb18bf3b9b5a373aecb3c28
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rds-credentials
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"